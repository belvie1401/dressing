<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Arial, Helvetica, sans-serif">
  <!--
    VERTUOSE - Appartement A902 - T4
    Rue de Lisbonne, ZAC Coteaux - Beauclair, 93110 Rosny-sous-Bois
    Surface habitable: 82.96 m² | Annexes: 11.35 m²
    Échelle: 50 px = 1 m
  -->

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="1"/>
    </pattern>
    <marker id="dimArrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="860" fill="#fafaf7"/>

  <!-- Title block -->
  <g>
    <rect x="20" y="20" width="1240" height="50" fill="#1a3a5c" stroke="#0d1f33" stroke-width="1"/>
    <text x="640" y="52" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
      VERTUOSE — Appartement A902 — T4 — 82,96 m²
    </text>
    <text x="640" y="72" font-size="11" fill="#444" text-anchor="middle">
      Rue de Lisbonne · ZAC Coteaux-Beauclair · 93110 Rosny-sous-Bois — Échelle 1:100
    </text>
  </g>

  <!-- ============== APARTMENT FOOTPRINT ============== -->
  <!-- Origin: walls drawn at scale 50 px = 1 m. Outer wall thickness = 8 px (~16 cm) -->

  <!-- Floor fill (interior) -->
  <g id="floor-fill" fill="#f3ece0" stroke="none">
    <!-- Séjour + Cuisine + Balcon area -->
    <polygon points="100,140 340,140 340,395 405,395 405,545 130,545 130,420 100,420"/>
    <!-- Entrée + bathrooms + Dgt -->
    <polygon points="340,140 720,140 720,395 340,395"/>
    <!-- Ch.3 + Ch.2 -->
    <polygon points="405,395 720,395 720,560 405,560"/>
    <!-- Ch.1 -->
    <polygon points="720,140 880,140 880,560 720,560"/>
    <!-- Terrasse -->
    <polygon points="880,210 1030,210 1030,360 880,360"/>
  </g>

  <!-- Terrasse hatch (exterior) -->
  <rect x="880" y="210" width="150" height="150" fill="url(#hatch)" opacity="0.4"/>
  <!-- Balcon hatch (exterior) -->
  <rect x="130" y="420" width="115" height="125" fill="url(#hatch)" opacity="0.4"/>

  <!-- ============== INTERIOR WALLS (thinner) ============== -->
  <g id="interior-walls" stroke="#1a1a1a" stroke-width="3" fill="none">
    <!-- Séjour / Cuisine separation -->
    <line x1="245" y1="395" x2="340" y2="395"/>
    <line x1="245" y1="395" x2="245" y2="545"/>
    <!-- Cuisine / Ch.3 -->
    <line x1="340" y1="395" x2="340" y2="430"/>
    <line x1="340" y1="500" x2="340" y2="545"/>
    <!-- Wait: Cuisine right wall vs Ch.3 left wall -->
    <!-- Replaced below by proper room outlines -->
  </g>

  <!-- ============== ROOM OUTLINES (interior partitions) ============== -->
  <g id="rooms" stroke="#1a1a1a" stroke-width="3" fill="none">

    <!-- SÉJOUR (4.5m × 4.8m ≈ 21.64m²) -->
    <rect x="100" y="140" width="240" height="255"/>

    <!-- BALCON (exterior, 2.3m × 2.5m ≈ 4.49m²) -->
    <rect x="130" y="420" width="115" height="125"/>

    <!-- CUISINE (2.9m × 2.5m ≈ 7.26m²) -->
    <rect x="245" y="395" width="160" height="150"/>

    <!-- ENTRÉE (1.7m × 3.1m ≈ 5.32m²) -->
    <rect x="340" y="140" width="85" height="155"/>

    <!-- WC (1.1m × 2.1m ≈ 2.32m²) -->
    <rect x="425" y="140" width="55" height="105"/>

    <!-- SDB (2.1m × 2.2m ≈ 4.62m²) -->
    <rect x="480" y="140" width="105" height="110"/>

    <!-- SDE (1.0m × 2.0m ≈ 1.99m²) -->
    <rect x="585" y="140" width="50" height="100"/>

    <!-- DGT — Dégagement (hallway, 5.00m²) -->
    <rect x="425" y="245" width="295" height="150"/>

    <!-- CH.3 (3.0m × 3.45m ≈ 10.44m²) -->
    <rect x="405" y="395" width="155" height="165"/>

    <!-- CH.2 (3.0m × 3.35m ≈ 10.01m²) -->
    <rect x="560" y="395" width="160" height="165"/>

    <!-- CH.1 (3.4m × 4.2m ≈ 14.36m²) -->
    <rect x="720" y="140" width="160" height="420"/>

    <!-- TERRASSE (3.0m × 2.3m ≈ 6.86m²) -->
    <rect x="880" y="210" width="150" height="150"/>
  </g>

  <!-- ============== OUTER WALLS (thick) ============== -->
  <g id="outer-walls" stroke="#1a1a1a" stroke-width="6" fill="none">
    <!-- North wall (top) -->
    <line x1="100" y1="140" x2="345" y2="140"/>
    <line x1="380" y1="140" x2="880" y2="140"/>
    <!-- East wall + terrasse opening -->
    <line x1="880" y1="140" x2="880" y2="210"/>
    <line x1="880" y1="360" x2="880" y2="560"/>
    <!-- South wall -->
    <line x1="100" y1="420" x2="130" y2="420"/>
    <line x1="245" y1="545" x2="405" y2="545"/>
    <line x1="405" y1="560" x2="880" y2="560"/>
    <!-- West wall -->
    <line x1="100" y1="140" x2="100" y2="420"/>
  </g>

  <!-- ============== DOORS (arc swing) ============== -->
  <g id="doors" stroke="#1a4a8a" stroke-width="1.5" fill="none">
    <!-- Front door (top, with arrow already drawn separately) -->
    <path d="M 345,140 A 35,35 0 0 1 380,175" />
    <line x1="345" y1="140" x2="380" y2="140" stroke="#fafaf7" stroke-width="6"/>
    <line x1="345" y1="140" x2="345" y2="175"/>

    <!-- Séjour ↔ Entrée -->
    <line x1="340" y1="200" x2="340" y2="240" stroke="#fafaf7" stroke-width="5"/>
    <path d="M 340,200 A 40,40 0 0 1 300,240"/>
    <line x1="340" y1="200" x2="300" y2="200"/>

    <!-- Cuisine ↔ Séjour -->
    <line x1="265" y1="395" x2="320" y2="395" stroke="#fafaf7" stroke-width="5"/>
    <path d="M 265,395 A 55,55 0 0 1 320,395" stroke-dasharray="4 3"/>

    <!-- Cuisine ↔ Balcon (door on south wall of cuisine) -->
    <line x1="270" y1="545" x2="310" y2="545" stroke="#fafaf7" stroke-width="5"/>

    <!-- Entrée ↔ WC -->
    <line x1="425" y1="180" x2="425" y2="220" stroke="#fafaf7" stroke-width="5"/>
    <path d="M 425,180 A 40,40 0 0 1 465,220"/>
    <line x1="425" y1="180" x2="465" y2="180"/>

    <!-- Dgt ↔ SDB -->
    <line x1="510" y1="250" x2="555" y2="250" stroke="#fafaf7" stroke-width="5"/>
    <path d="M 510,250 A 45,45 0 0 1 510,295"/>
    <line x1="510" y1="250" x2="510" y2="295"/>

    <!-- Dgt ↔ SDE -->
    <line x1="595" y1="240" x2="630" y2="240" stroke="#fafaf7" stroke-width="5"/>
    <path d="M 595,240 A 35,35 0 0 1 595,275"/>
    <line x1="595" y1="240" x2="595" y2="275"/>

    <!-- Dgt ↔ Ch.3 -->
    <line x1="445" y1="395" x2="490" y2="395" stroke="#fafaf7" stroke-width="5"/>
    <path d="M 445,395 A 45,45 0 0 1 490,440"/>
    <line x1="445" y1="395" x2="445" y2="440"/>

    <!-- Dgt ↔ Ch.2 -->
    <line x1="600" y1="395" x2="645" y2="395" stroke="#fafaf7" stroke-width="5"/>
    <path d="M 600,395 A 45,45 0 0 1 645,440"/>
    <line x1="600" y1="395" x2="600" y2="440"/>

    <!-- Dgt ↔ Ch.1 -->
    <line x1="720" y1="280" x2="720" y2="325" stroke="#fafaf7" stroke-width="5"/>
    <path d="M 720,280 A 45,45 0 0 1 765,325"/>
    <line x1="720" y1="280" x2="765" y2="280"/>

    <!-- Ch.1 ↔ Terrasse -->
    <line x1="880" y1="245" x2="880" y2="320" stroke="#fafaf7" stroke-width="5"/>
  </g>

  <!-- ============== WINDOWS (double line) ============== -->
  <g id="windows" stroke="#1a4a8a" stroke-width="2" fill="none">
    <!-- Séjour west wall (large window) -->
    <line x1="100" y1="180" x2="100" y2="360" stroke="#fafaf7" stroke-width="8"/>
    <line x1="98" y1="180" x2="98" y2="360"/>
    <line x1="102" y1="180" x2="102" y2="360"/>

    <!-- Séjour south wall (PF — porte-fenêtre to balcon) -->
    <line x1="135" y1="420" x2="240" y2="420" stroke="#fafaf7" stroke-width="8"/>
    <line x1="135" y1="418" x2="240" y2="418"/>
    <line x1="135" y1="422" x2="240" y2="422"/>

    <!-- Cuisine south window -->
    <line x1="320" y1="545" x2="395" y2="545" stroke="#fafaf7" stroke-width="8"/>
    <line x1="320" y1="543" x2="395" y2="543"/>
    <line x1="320" y1="547" x2="395" y2="547"/>

    <!-- Ch.3 south window -->
    <line x1="430" y1="560" x2="540" y2="560" stroke="#fafaf7" stroke-width="8"/>
    <line x1="430" y1="558" x2="540" y2="558"/>
    <line x1="430" y1="562" x2="540" y2="562"/>

    <!-- Ch.2 south window -->
    <line x1="585" y1="560" x2="700" y2="560" stroke="#fafaf7" stroke-width="8"/>
    <line x1="585" y1="558" x2="700" y2="558"/>
    <line x1="585" y1="562" x2="700" y2="562"/>

    <!-- Ch.1 east window (PF to terrasse already as door) + south window -->
    <line x1="755" y1="560" x2="860" y2="560" stroke="#fafaf7" stroke-width="8"/>
    <line x1="755" y1="558" x2="860" y2="558"/>
    <line x1="755" y1="562" x2="860" y2="562"/>

    <!-- Ch.1 north window -->
    <line x1="755" y1="140" x2="860" y2="140" stroke="#fafaf7" stroke-width="8"/>
    <line x1="755" y1="138" x2="860" y2="138"/>
    <line x1="755" y1="142" x2="860" y2="142"/>
  </g>

  <!-- ============== ENTRY ARROW ============== -->
  <g>
    <polygon points="362,105 372,125 352,125" fill="#c0392b"/>
    <text x="362" y="100" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="bold">ENTRÉE</text>
  </g>

  <!-- ============== ROOM LABELS ============== -->
  <g id="labels" font-family="Arial, sans-serif" text-anchor="middle">
    <!-- Séjour -->
    <text x="220" y="262" font-size="16" font-weight="bold" fill="#1a3a5c">Séjour</text>
    <text x="220" y="280" font-size="13" fill="#1a3a5c">21,64 m²</text>

    <!-- Balcon -->
    <text x="187" y="478" font-size="11" font-weight="bold" fill="#555">Balcon</text>
    <text x="187" y="492" font-size="10" fill="#555">4,49 m²</text>

    <!-- Cuisine -->
    <text x="325" y="465" font-size="13" font-weight="bold" fill="#1a3a5c">Cuisine</text>
    <text x="325" y="480" font-size="11" fill="#1a3a5c">7,26 m²</text>

    <!-- Entrée -->
    <text x="382" y="215" font-size="11" font-weight="bold" fill="#1a3a5c">Entrée</text>
    <text x="382" y="228" font-size="9" fill="#1a3a5c">5,32 m²</text>

    <!-- WC -->
    <text x="452" y="190" font-size="9" font-weight="bold" fill="#1a3a5c">WC</text>
    <text x="452" y="202" font-size="8" fill="#1a3a5c">2,32 m²</text>

    <!-- SDB -->
    <text x="532" y="190" font-size="11" font-weight="bold" fill="#1a3a5c">SDB</text>
    <text x="532" y="204" font-size="9" fill="#1a3a5c">4,62 m²</text>

    <!-- SDE -->
    <text x="610" y="190" font-size="9" font-weight="bold" fill="#1a3a5c">SDE</text>
    <text x="610" y="202" font-size="8" fill="#1a3a5c">1,99 m²</text>

    <!-- Dgt -->
    <text x="572" y="320" font-size="13" font-weight="bold" fill="#1a3a5c">Dgt</text>
    <text x="572" y="335" font-size="11" fill="#1a3a5c">5,00 m²</text>

    <!-- Ch.3 -->
    <text x="482" y="475" font-size="14" font-weight="bold" fill="#1a3a5c">Ch. 3</text>
    <text x="482" y="492" font-size="11" fill="#1a3a5c">10,44 m²</text>

    <!-- Ch.2 -->
    <text x="640" y="475" font-size="14" font-weight="bold" fill="#1a3a5c">Ch. 2</text>
    <text x="640" y="492" font-size="11" fill="#1a3a5c">10,01 m²</text>

    <!-- Ch.1 -->
    <text x="800" y="345" font-size="15" font-weight="bold" fill="#1a3a5c">Ch. 1</text>
    <text x="800" y="362" font-size="12" fill="#1a3a5c">14,36 m²</text>

    <!-- Terrasse -->
    <text x="955" y="285" font-size="12" font-weight="bold" fill="#555">Terrasse</text>
    <text x="955" y="300" font-size="10" fill="#555">6,86 m²</text>
  </g>

  <!-- ============== DIMENSION LINES ============== -->
  <g id="dimensions" stroke="#444" stroke-width="0.8" fill="#444" font-size="10" font-family="Arial">
    <!-- Total width along top -->
    <line x1="100" y1="105" x2="100" y2="135" stroke-dasharray="2 2"/>
    <line x1="880" y1="105" x2="880" y2="135" stroke-dasharray="2 2"/>
    <line x1="100" y1="118" x2="880" y2="118" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="490" y="113" text-anchor="middle">15,60 m</text>

    <!-- Apartment depth left side -->
    <line x1="65" y1="140" x2="95" y2="140" stroke-dasharray="2 2"/>
    <line x1="65" y1="420" x2="95" y2="420" stroke-dasharray="2 2"/>
    <line x1="80" y1="140" x2="80" y2="420" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="60" y="284" text-anchor="middle" transform="rotate(-90 60 284)">5,60 m</text>

    <!-- Séjour width -->
    <line x1="100" y1="595" x2="100" y2="565" stroke-dasharray="2 2"/>
    <line x1="245" y1="565" x2="245" y2="595" stroke-dasharray="2 2"/>
    <line x1="100" y1="585" x2="245" y2="585" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="172" y="580" text-anchor="middle">2,90 m</text>

    <!-- Cuisine width -->
    <line x1="245" y1="595" x2="245" y2="565" stroke-dasharray="2 2"/>
    <line x1="405" y1="565" x2="405" y2="595" stroke-dasharray="2 2"/>
    <line x1="245" y1="585" x2="405" y2="585" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="325" y="580" text-anchor="middle">3,20 m</text>

    <!-- Ch.3 width -->
    <line x1="405" y1="595" x2="405" y2="565" stroke-dasharray="2 2"/>
    <line x1="560" y1="565" x2="560" y2="595" stroke-dasharray="2 2"/>
    <line x1="405" y1="585" x2="560" y2="585" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="482" y="580" text-anchor="middle">3,10 m</text>

    <!-- Ch.2 width -->
    <line x1="560" y1="595" x2="560" y2="565" stroke-dasharray="2 2"/>
    <line x1="720" y1="565" x2="720" y2="595" stroke-dasharray="2 2"/>
    <line x1="560" y1="585" x2="720" y2="585" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="640" y="580" text-anchor="middle">3,20 m</text>

    <!-- Ch.1 width -->
    <line x1="720" y1="595" x2="720" y2="565" stroke-dasharray="2 2"/>
    <line x1="880" y1="565" x2="880" y2="595" stroke-dasharray="2 2"/>
    <line x1="720" y1="585" x2="880" y2="585" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="800" y="580" text-anchor="middle">3,20 m</text>

    <!-- Ch.1 depth (right side) -->
    <line x1="900" y1="140" x2="900" y2="140" stroke="none"/>
    <line x1="1050" y1="140" x2="1080" y2="140" stroke-dasharray="2 2"/>
    <line x1="1050" y1="560" x2="1080" y2="560" stroke-dasharray="2 2"/>
    <line x1="1065" y1="140" x2="1065" y2="560" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="1083" y="354" text-anchor="middle" transform="rotate(90 1083 354)">8,40 m</text>
  </g>

  <!-- ============== LEGEND ============== -->
  <g id="legend">
    <rect x="20" y="640" width="760" height="200" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.5"/>
    <text x="35" y="665" font-size="14" font-weight="bold" fill="#1a3a5c">LÉGENDE</text>
    <line x1="35" y1="672" x2="200" y2="672" stroke="#1a3a5c" stroke-width="1"/>

    <!-- Symbols column 1 -->
    <g transform="translate(35,690)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1a1a1a" stroke-width="6"/>
      <text x="55" y="4" font-size="11" fill="#1a1a1a">Mur extérieur (porteur)</text>

      <line x1="0" y1="22" x2="40" y2="22" stroke="#1a1a1a" stroke-width="3"/>
      <text x="55" y="26" font-size="11" fill="#1a1a1a">Cloison intérieure</text>

      <g transform="translate(0,40)">
        <line x1="0" y1="3" x2="40" y2="3" stroke="#1a4a8a" stroke-width="2"/>
        <line x1="0" y1="7" x2="40" y2="7" stroke="#1a4a8a" stroke-width="2"/>
      </g>
      <text x="55" y="50" font-size="11" fill="#1a1a1a">Fenêtre / Porte-fenêtre</text>

      <g transform="translate(0,68)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#1a4a8a" stroke-width="1.5"/>
        <path d="M 0,0 A 20,20 0 0 1 20,20" stroke="#1a4a8a" stroke-width="1.5" fill="none"/>
      </g>
      <text x="55" y="84" font-size="11" fill="#1a1a1a">Porte (avec sens d'ouverture)</text>

      <rect x="0" y="100" width="40" height="14" fill="url(#hatch)" opacity="0.5" stroke="#1a1a1a" stroke-width="1"/>
      <text x="55" y="111" font-size="11" fill="#1a1a1a">Surface annexe (balcon / terrasse)</text>

      <polygon points="15,128 25,148 5,148" fill="#c0392b"/>
      <text x="55" y="142" font-size="11" fill="#1a1a1a">Entrée principale</text>
    </g>

    <!-- Surfaces summary column 2 -->
    <g transform="translate(360,690)">
      <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a3a5c">SURFACES (Carrez)</text>
      <line x1="0" y1="6" x2="380" y2="6" stroke="#1a3a5c" stroke-width="0.5"/>

      <g font-size="10" fill="#1a1a1a">
        <text x="0" y="22">Entrée</text>           <text x="180" y="22" text-anchor="end">5,32 m²</text>
        <text x="0" y="36">Séjour</text>           <text x="180" y="36" text-anchor="end">21,64 m²</text>
        <text x="0" y="50">Cuisine</text>          <text x="180" y="50" text-anchor="end">7,26 m²</text>
        <text x="0" y="64">Chambre 1</text>        <text x="180" y="64" text-anchor="end">14,36 m²</text>
        <text x="0" y="78">Chambre 2</text>        <text x="180" y="78" text-anchor="end">10,01 m²</text>
        <text x="0" y="92">Chambre 3</text>        <text x="180" y="92" text-anchor="end">10,44 m²</text>

        <text x="200" y="22">Dégagement</text>     <text x="380" y="22" text-anchor="end">5,00 m²</text>
        <text x="200" y="36">SDB</text>            <text x="380" y="36" text-anchor="end">4,62 m²</text>
        <text x="200" y="50">SDE</text>            <text x="380" y="50" text-anchor="end">1,99 m²</text>
        <text x="200" y="64">WC</text>             <text x="380" y="64" text-anchor="end">2,32 m²</text>
      </g>

      <line x1="0" y1="105" x2="380" y2="105" stroke="#1a3a5c" stroke-width="0.5"/>
      <text x="0" y="120" font-size="11" font-weight="bold" fill="#1a3a5c">TOTAL HABITABLE</text>
      <text x="380" y="120" font-size="11" font-weight="bold" fill="#1a3a5c" text-anchor="end">82,96 m²</text>

      <text x="0" y="138" font-size="10" fill="#555">Terrasse</text>
      <text x="180" y="138" font-size="10" fill="#555" text-anchor="end">6,86 m²</text>
      <text x="200" y="138" font-size="10" fill="#555">Balcon</text>
      <text x="380" y="138" font-size="10" fill="#555" text-anchor="end">4,49 m²</text>
      <text x="0" y="152" font-size="10" font-weight="bold" fill="#555">TOTAL ANNEXES</text>
      <text x="380" y="152" font-size="10" font-weight="bold" fill="#555" text-anchor="end">11,35 m²</text>
    </g>
  </g>

  <!-- North arrow -->
  <g transform="translate(1140,720)">
    <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.5"/>
    <polygon points="0,-32 8,0 0,-8 -8,0" fill="#c0392b"/>
    <polygon points="0,32 8,0 0,8 -8,0" fill="#1a3a5c"/>
    <text x="0" y="-44" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">N</text>
    <text x="0" y="56" font-size="11" text-anchor="middle" fill="#1a3a5c">S</text>
    <text x="-50" y="4" font-size="11" text-anchor="middle" fill="#1a3a5c">O</text>
    <text x="50" y="4" font-size="11" text-anchor="middle" fill="#1a3a5c">E</text>
  </g>

